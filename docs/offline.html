<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060c06" />
  <title>WildLens — No Connection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #060c06;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #f0f0f0; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { text-align: center; padding: 32px 24px; max-width: 320px; }
    .icon {
      width: 72px; height: 72px; background: #111a11; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; color: #f0f0f0; }
    p  { font-size: 14px; line-height: 1.6; color: #888; margin-bottom: 28px; }
    button {
      height: 44px; padding: 0 28px; background: #16a34a; border: none;
      border-radius: 9999px; font-size: 15px; font-weight: 600; color: #fff;
      cursor: pointer; font-family: inherit;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>No connection</h1>
    <p>WildLens needs an internet connection to show the latest wildlife news. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
